<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.webmanifest">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* touch play: the game owns every gesture, so a drag never scrolls or zooms the page, a held finger (the grab) never opens a text selection or callout, and a tap never flashes */
      html, body, #unity-canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* the game keeps 16:9 and takes the largest box the window allows; the rest is black */
      #unity-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; background: #231F20; outline: none; }
      #unity-loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40%; max-width: 400px; color: #ddd; font: 14px sans-serif; text-align: center; }
      #unity-progress-empty { margin-top: 8px; height: 10px; background: #444; border-radius: 5px; overflow: hidden; }
      #unity-progress-full { height: 100%; width: 0%; background: #ddd; }
      #unity-fullscreen-button { position: absolute; right: 12px; bottom: 12px; padding: 6px 10px; font: 13px sans-serif; color: #fff; background: rgba(0,0,0,0.5); border: 1px solid #888; border-radius: 4px; cursor: pointer; z-index: 2; }
      #unity-ios-hint { position: absolute; right: 12px; bottom: 12px; max-width: 60%; padding: 6px 10px; font: 13px sans-serif; color: #fff; background: rgba(0,0,0,0.5); border: 1px solid #888; border-radius: 4px; z-index: 2; display: none; }
      /* iOS cannot lock the orientation, so a phone held in portrait is covered by this message and the game is paused; the overlay swallows every touch */
      #unity-rotate-overlay { display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 10; background: #000; color: #fff; font: 18px sans-serif; text-align: center; flex-direction: column; align-items: center; justify-content: center; touch-action: none; }
      /* the icon is black on transparent, inverted to white for the black overlay */
      #unity-rotate-overlay img { width: 96px; height: 96px; margin-bottom: 16px; filter: invert(1); }
      @media (pointer: coarse) and (orientation: portrait) and (max-width: 900px) { #unity-rotate-overlay { display: flex; } }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: white; padding: 10px; display: none; z-index: 3; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">Loading...<div id="unity-progress-empty"><div id="unity-progress-full"></div></div></div>
    <button id="unity-fullscreen-button" title="Fullscreen">Fullscreen</button>
    <div id="unity-ios-hint">For fullscreen: Share, then Add to Home Screen (open in Safari)</div>
    <div id="unity-warning"></div>
    <div id="unity-rotate-overlay"><img src="rotate-phone.png" alt="">Please rotate your phone<br>to landscape to play</div>
    <script>
      // FitWindow template: keeps the game at 16:9 and scales it to fit any
      // browser window, so it never spills off a small laptop screen. The game
      // renders at the screen's real pixel density (sharp on Retina & 4K); set
      // MAX_RENDER_HEIGHT to a number (eg 1080) to cap it if frame rate drops.
      var ASPECT = 16 / 9;
      var MAX_RENDER_HEIGHT = 0; // 0 = no cap

      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var progressFull = document.querySelector("#unity-progress-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // iPhone browsers (all WebKit) lack the Fullscreen API for a canvas, so SetFullscreen does nothing there: hide the dead button
      if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
        fullscreenButton.style.display = "none";
        // on iOS, point to the home-screen route unless already launched from it
        var isIos = /iPhone|iPad|iPod/.test(navigator.userAgent);
        var isStandalone = window.navigator.standalone === true;
        if (isIos && !isStandalone) {
          document.querySelector("#unity-ios-hint").style.display = "block";
        }
      }

      // portrait on a touch phone: the overlay (CSS) covers the game, and a live run is paused, never auto-resumed, so the player taps Resume on the pause screen
      var unityInstance = null;
      var portraitQuery = window.matchMedia("(pointer: coarse) and (orientation: portrait) and (max-width: 900px)");
      function pauseIfPortrait() {
        if (unityInstance && portraitQuery.matches) {
          unityInstance.SendMessage("GameController", "PauseFromBrowser");
        }
      }
      portraitQuery.addEventListener("change", pauseIfPortrait);

      function fitCanvas() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        if (w / h > ASPECT) { w = h * ASPECT; } else { h = w / ASPECT; }
        canvas.style.width = Math.floor(w) + "px";
        canvas.style.height = Math.floor(h) + "px";
      }
      window.addEventListener("resize", fitCanvas);
      fitCanvas();

      function renderPixelRatio() {
        var dpr = window.devicePixelRatio || 1;
        if (MAX_RENDER_HEIGHT > 0) {
          dpr = Math.min(dpr, MAX_RENDER_HEIGHT / (window.screen.height || 1080));
        }
        return Math.max(dpr, 0.5);
      }

      function unityShowBanner(msg, type) {
        warningBanner.style.display = "block";
        var div = document.createElement("div");
        div.innerHTML = msg;
        if (type == "error") div.style = "background: red; padding: 10px;";
        else if (type == "warning") div.style = "background: yellow; padding: 10px;";
        warningBanner.appendChild(div);
        if (type != "error") {
          setTimeout(function () {
            warningBanner.removeChild(div);
            if (!warningBanner.children.length) warningBanner.style.display = "none";
          }, 5000);
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        devicePixelRatio: renderPixelRatio(),
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressFull.style.width = 100 * progress + "%";
        }).then(function (instance) {
          unityInstance = instance;
          loading.style.display = "none";
          canvas.focus();
          fullscreenButton.onclick = function () { unityInstance.SetFullscreen(1); };
          pauseIfPortrait();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
      canvas.addEventListener("click", function () { canvas.focus(); });
      // a long press (the grab) must not open the browser's context menu
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    </script>
  </body>
</html>
